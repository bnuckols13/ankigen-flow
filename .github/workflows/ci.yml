name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint data
        run: npm run lint:data
      - name: Lint golden sample
        run: npm run lint:fixtures
      - name: Tests
        run: npm test
